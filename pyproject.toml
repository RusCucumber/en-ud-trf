[project]
name = "en-ud-trf"
version = "0.1.0"
description = "Training a spaCy transformer POS tagger and Universal Dependencies parser for English, for use in V-CAT"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">= 3.11"
authors = [
  { name = "Ryuki Matsuura", email = "rmatsuur@andrew.cmu.edu" },
]
dependencies = [
  "click<8.2",
  "spacy==3.5.4",
  "spacy-transformers==1.2.5",
  "torch>=2.15.0",
  "transformers==4.30.2",
]

[project.optional-dependencies]
cupy = [
  "cupy-cuda13x>=13.6.0",
  "thinc>=8.1.12",
]

[dependency-groups]
dev = [
  "pypdf>=6.7.5",
  "pytest>=9.0.1",
  "ruff>=0.14.6",
  "spacy-huggingface-hub>=0.0.10",
  "ty>=0.0.65",
  "wheel>=0.48.0",
]

[tool.ruff]
target-version = "py311"
line-length = 119
include = [
  "scripts/**",
  "tests/**",
]
exclude = [
  "__pycache__",
]

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "C90",
]
ignore = [
  "E203",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ty.environment]
root = [
  "./tests",
]
python-version = "3.11"

[tool.ty.src]
include = [
  "tests",
]
exclude = [
  "__pycache__",
]

[tool.uv]
managed = true
package = false
