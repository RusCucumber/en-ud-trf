[project]
name = "en-ud-trf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">= 3.11"
authors = [
    { name = "Ryuki Matsuura", email = "rmatsuur@andrew.cmu.edu" },
]
dependencies = [
    "marimo>=0.18.4",
    "matplotlib>=3.10.7",
    "numpy>=2.3.5",
    "openai>=2.14.0",
    "pandas>=2.3.3",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "scipy>=1.16.3",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "pypdf>=6.7.5",
    "pytest>=9.0.1",
    "radian>=0.6.15",
    "ruff>=0.14.6",
    "ty>=0.0.65",
]

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = [
    "src/en_ud_trf",
]

[tool.ruff]
target-version = "py311"
line-length = 119
include = [
    "src/**",
    "tests/**",
    "notebooks/python/**",
]
exclude = [
    "__pycache__",
    "__marimo__",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "C90",
]
ignore = [
    "E203",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ty.environment]
root = [
    "./src",
    "./tests",
    "./notebooks/python",
]
python-version = "3.11"

[tool.ty.src]
include = [
    "src",
    "tests",
    "notebooks/python",
]
exclude = [
    "__pycache__",
    "__marimo__",
]

[tool.uv]
managed = true
package = true
